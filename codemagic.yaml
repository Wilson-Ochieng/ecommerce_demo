workflows:
  android-release:
    name: Duka Letu Android Release

    instance_type: linux_x2

    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze project
        script: |
          flutter analyze

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk